# Copy to .github/workflows/marsa-preview.yml in YOUR project.
# Posts a Marsa preview link of the static build on every pull request.
#
# Setup: Settings → Secrets and variables → Actions → Variables → New variable
#   MARSA_URL = https://marsa.example.com   (your instance)
# No secrets are needed: Marsa uploads are anonymous.
name: Marsa preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # to post the preview comment

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Replace with your build. The output folder must contain index.html.
      - run: npm ci && npm run build
      - name: Publish to Marsa
        id: marsa
        env:
          MARSA_URL: ${{ vars.MARSA_URL }}
          BUILD_DIR: dist
        run: |
          (cd "$BUILD_DIR" && zip -qr "$RUNNER_TEMP/site.zip" .)
          curl -sS -f -X POST "$MARSA_URL/api/sites?ttlHours=72" \
            -H "Content-Type: application/zip" --data-binary @"$RUNNER_TEMP/site.zip" > "$RUNNER_TEMP/marsa.json"
          echo "url=$(jq -r .url "$RUNNER_TEMP/marsa.json")" >> "$GITHUB_OUTPUT"
          echo "expires=$(jq -r .expiresAt "$RUNNER_TEMP/marsa.json")" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.marsa.outputs.url }}
          EXPIRES: ${{ steps.marsa.outputs.expires }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview: ${process.env.URL}\n\nExpires ${process.env.EXPIRES}.`,
            });
