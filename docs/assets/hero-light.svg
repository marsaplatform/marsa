<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Marsa Spaces</title><desc id="d">The harbor where your AI agent's work lands. Static spaces, Cloudflare Workers and MCP servers in one small self-hosted app.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f8f5"/><stop offset="1" stop-color="#dceccf"/></linearGradient>
<radialGradient id="r" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7fbf8f" stop-opacity=".55"/><stop offset="1" stop-color="#7fbf8f" stop-opacity="0"/></radialGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,'Noto Sans','Noto Sans Arabic',sans-serif}
.h{font-size:58px;font-weight:800;fill:#152e29;letter-spacing:-1px}
.t{font-size:22px;fill:#52665e}
.ar{font-size:22px;fill:#145a49;font-weight:700}
.chip{font-size:18px;font-weight:700;fill:#152e29}
.sub{font-size:14px;fill:#52665e}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#52665e}
.w1{animation:drift 14s linear infinite}
.w2{animation:drift 9s linear infinite reverse}
.bob{animation:bob 6s ease-in-out infinite}
.blink{animation:blink 2.4s ease-in-out infinite}
.beam{transform-origin:110px 120px;animation:pulse 3.2s ease-in-out infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-240px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:.9;transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){.w1,.w2,.bob,.blink,.beam,.flow,.ring{animation:none}}
</style>
<rect width="1200" height="340" rx="24" fill="url(#g)"/>
<circle class="beam" cx="110" cy="120" r="70" fill="url(#r)"/>
<g fill="#145a49"><rect x="100" y="120" width="20" height="96" rx="3"/><path d="M94 120h32l-6-18h-20z"/><rect x="104" y="92" width="12" height="10" rx="2" fill="#7fbf8f"/></g>
<text x="180" y="150" class="h">Marsa Spaces</text>
<text x="182" y="190" class="t">The harbor where your AI agent's work lands.</text>
<text x="182" y="226" class="ar" >مَرسى: حيث يرسو عمل وكيلك الذكي</text>
<text x="182" y="262" class="mono">POST /api/sites → https://…/s/&lt;id&gt;/  ·  /llms.txt  ·  /mcp/s/&lt;id&gt;</text>
<g class="bob" style="animation-delay:-0.0s"><rect x="700" y="118" width="148" height="70" rx="14" fill="#fbfcfa" stroke="#cedbd2"/><circle cx="720" cy="140" r="6" fill="#145a49" class="blink" style="animation-delay:-0.0s"/><text x="734" y="145" class="chip">Spaces</text><text x="716" y="172" class="sub">links that expire</text></g><g class="bob" style="animation-delay:-1.3s"><rect x="860" y="118" width="148" height="70" rx="14" fill="#fbfcfa" stroke="#cedbd2"/><circle cx="880" cy="140" r="6" fill="#145a49" class="blink" style="animation-delay:-0.7s"/><text x="894" y="145" class="chip">Workers</text><text x="876" y="172" class="sub">on Cloudflare</text></g><g class="bob" style="animation-delay:-2.6s"><rect x="1020" y="118" width="148" height="70" rx="14" fill="#fbfcfa" stroke="#cedbd2"/><circle cx="1040" cy="140" r="6" fill="#145a49" class="blink" style="animation-delay:-1.4s"/><text x="1054" y="145" class="chip">MCP</text><text x="1036" y="172" class="sub">a server per space</text></g>
<g opacity=".55"><path class="w1" fill="#2f7d63" fill-opacity=".35" d="M0 300 q60 -18 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 V340 H0z"/></g>
<g opacity=".7"><path class="w2" fill="#145a49" fill-opacity=".28" d="M0 312 q60 14 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 V340 H0z"/></g>
</svg>