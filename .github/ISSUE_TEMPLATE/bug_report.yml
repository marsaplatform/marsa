name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't** include real tokens, private URLs or personal data.
        Security issues: see SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A curl command or a minimal sample site helps a lot.
      placeholder: |
        1. curl -X POST http://localhost:8080/api/sites ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.2.0 or a commit SHA"
  - type: dropdown
    id: runtime
    attributes:
      label: How do you run it?
      options: [Docker / compose, Node.js (npm start), npm run dev, Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error JSON
      render: text
